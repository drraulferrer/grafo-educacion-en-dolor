<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grafo de conceptos · Educación en Dolor</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root {
    --ground:#f7f9fa; --panel:#fff; --ink:#14303f; --ink-2:#5b7683;
    --line:#dde5e9; --line-2:#eef3f5; --track:#e6edf0;
    --teal:#2f7f8f; --teal-deep:#1d5866; --gold:#c9a227; --coral:#c25e4a;
    --lienzo:#f2f6f7; --arista:#8fa6b0; --shadow:0 1px 2px rgba(20,48,63,.06);
    --sombra-flotante:0 6px 24px rgba(20,48,63,.13);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground:#0f171b; --panel:#16232a; --ink:#e4edf1; --ink-2:#93a9b4;
      --line:#26353d; --line-2:#1d2b32; --track:#22323a;
      --teal:#57b6c6; --teal-deep:#8ad3e0; --gold:#d9b545; --coral:#d9765f;
      --lienzo:#0b1216; --arista:#5a7280; --shadow:none;
      --sombra-flotante:0 6px 24px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"] {
    --ground:#0f171b; --panel:#16232a; --ink:#e4edf1; --ink-2:#93a9b4;
    --line:#26353d; --line-2:#1d2b32; --track:#22323a;
    --teal:#57b6c6; --teal-deep:#8ad3e0; --gold:#d9b545; --coral:#d9765f;
    --lienzo:#0b1216; --arista:#5a7280; --shadow:none;
    --sombra-flotante:0 6px 24px rgba(0,0,0,.5);
  }
  :root[data-theme="light"] {
    --ground:#f7f9fa; --panel:#fff; --ink:#14303f; --ink-2:#5b7683;
    --line:#dde5e9; --line-2:#eef3f5; --track:#e6edf0;
    --teal:#2f7f8f; --teal-deep:#1d5866; --gold:#c9a227; --coral:#c25e4a;
    --lienzo:#f2f6f7; --arista:#8fa6b0; --shadow:0 1px 2px rgba(20,48,63,.06);
    --sombra-flotante:0 6px 24px rgba(20,48,63,.13);
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--ground); color:var(--ink); overflow:hidden;
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  h1{font-family:Charter,"Bitstream Charter",Georgia,serif; font-weight:600;
     font-size:17px; margin:0; letter-spacing:-.2px}
  button{font:inherit; color:inherit}

  .app{display:grid; grid-template-columns:264px 1fr; height:100vh}

  /* ---------- barra lateral ---------- */
  aside{background:var(--panel); border-right:1px solid var(--line);
        overflow-y:auto; padding:16px 15px 28px; display:flex;
        flex-direction:column; gap:16px}
  .cabecera .sello{font-size:11.5px; color:var(--ink-2); margin-top:4px;
                   font-variant-numeric:tabular-nums}
  .cabecera .sello b{color:var(--teal); font-weight:600}

  .bloque > .rot{font-size:10.5px; text-transform:uppercase; letter-spacing:.9px;
                 color:var(--ink-2); font-weight:600; margin:0 0 7px;
                 display:flex; justify-content:space-between; align-items:center}
  .rot button{background:none; border:0; padding:0; cursor:pointer;
              font-size:10.5px; letter-spacing:.4px; color:var(--teal);
              text-transform:none}
  .rot button:hover{text-decoration:underline}

  input[type=search]{width:100%; padding:7px 9px; border:1px solid var(--line);
    border-radius:7px; background:var(--ground); color:var(--ink); font:inherit}
  input[type=search]:focus{outline:2px solid var(--teal); outline-offset:-1px}

  .segmentado{display:flex; background:var(--ground); border:1px solid var(--line);
              border-radius:7px; padding:2px; gap:2px}
  .segmentado button{flex:1; border:0; background:none; padding:5px 4px;
    border-radius:5px; cursor:pointer; font-size:12.5px; color:var(--ink-2)}
  .segmentado button[aria-pressed=true]{background:var(--panel); color:var(--ink);
    font-weight:600; box-shadow:var(--shadow)}

  .lista{display:flex; flex-direction:column; gap:1px}
  .item{display:flex; align-items:center; gap:8px; padding:4px 5px; border-radius:6px;
        cursor:pointer; font-size:12.5px; line-height:1.35}
  .item:hover{background:var(--line-2)}
  .item input{margin:0; accent-color:var(--teal); flex:none}
  .item .punto{width:9px; height:9px; border-radius:50%; flex:none}
  .item .txt{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis;
             white-space:nowrap}
  .item .num{color:var(--ink-2); font-size:11px; font-variant-numeric:tabular-nums}
  .item.off .txt, .item.off .num{opacity:.42}
  .item .raya{width:14px; height:0; flex:none; border-top-width:2px}

  .opciones{display:flex; flex-direction:column; gap:2px}

  .pie{font-size:11px; color:var(--ink-2); line-height:1.45; border-top:1px solid var(--line);
       padding-top:11px; margin-top:auto}
  .pie code{font-family:ui-monospace,Menlo,monospace; font-size:10.5px;
            background:var(--line-2); padding:1px 4px; border-radius:4px}

  /* ---------- lienzo ---------- */
  main{position:relative; background:var(--lienzo); overflow:hidden}
  canvas{display:block; width:100%; height:100%; cursor:grab}
  canvas.arrastrando{cursor:grabbing}
  canvas.sobre-nodo{cursor:pointer}

  .flotante{position:absolute; background:var(--panel); border:1px solid var(--line);
            border-radius:9px; box-shadow:var(--sombra-flotante)}

  .contador{top:12px; left:12px; padding:7px 11px; font-size:11.5px;
            color:var(--ink-2); font-variant-numeric:tabular-nums}
  .contador b{color:var(--ink); font-weight:600}

  .mandos{top:12px; right:12px; display:flex; padding:3px; gap:2px}
  .mandos button{border:0; background:none; width:29px; height:27px; border-radius:6px;
                 cursor:pointer; font-size:14px; line-height:1; color:var(--ink-2)}
  .mandos button:hover{background:var(--line-2); color:var(--ink)}

  .aviso{bottom:12px; left:12px; right:12px; max-width:520px; padding:9px 12px;
         font-size:11.5px; color:var(--ink-2); line-height:1.45}
  .aviso b{color:var(--ink); font-weight:600}

  /* ---------- ficha ---------- */
  .ficha{position:absolute; top:12px; right:12px; bottom:12px; width:330px;
         display:flex; flex-direction:column; overflow:hidden}
  .ficha[hidden]{display:none}
  .ficha header{padding:13px 15px 11px; border-bottom:1px solid var(--line);
                display:flex; gap:10px; align-items:flex-start}
  .ficha header .cod{font-family:ui-monospace,Menlo,monospace; font-size:10.5px;
                     color:var(--ink-2); letter-spacing:.3px}
  .ficha header h2{font-family:Charter,Georgia,serif; font-size:16px; margin:3px 0 0;
                   font-weight:600; line-height:1.3; text-wrap:balance}
  .ficha .cerrar{border:0; background:none; cursor:pointer; font-size:17px;
                 color:var(--ink-2); padding:0 2px; line-height:1; flex:none}
  .ficha .cuerpo{padding:13px 15px 20px; overflow-y:auto; font-size:13px}
  .ficha h3{font-size:10.5px; text-transform:uppercase; letter-spacing:.9px;
            color:var(--ink-2); font-weight:600; margin:16px 0 6px}
  .ficha h3:first-child{margin-top:0}
  .ficha p{margin:0 0 8px; line-height:1.55}
  .chips{display:flex; flex-wrap:wrap; gap:4px}
  .chip{font-size:10.5px; padding:2px 7px; border-radius:20px; background:var(--line-2);
        color:var(--ink-2); white-space:nowrap}
  .chip.fuerte{background:var(--teal); color:#fff}
  .chip.alerta{background:var(--coral); color:#fff}
  .rel{display:block; width:100%; text-align:left; border:0; background:none;
       padding:5px 6px; border-radius:6px; cursor:pointer; font:inherit;
       font-size:12.5px; line-height:1.4; border-left:2px solid transparent}
  .rel:hover{background:var(--line-2)}
  .rel .quien{color:var(--ink-2); font-size:10.5px; display:block; margin-bottom:1px}
  .rel .nota{color:var(--ink-2); font-size:11px; display:block; margin-top:2px;
             font-style:italic}

  .vacio{color:var(--ink-2); font-size:12.5px}

  /* ---------- móvil ---------- */
  .abre-menu{display:none}
  @media (max-width:860px){
    .app{grid-template-columns:1fr}
    aside{position:absolute; z-index:5; top:0; bottom:0; width:264px;
          transform:translateX(-100%); transition:transform .18s ease;
          box-shadow:var(--sombra-flotante)}
    aside.abierta{transform:none}
    .abre-menu{display:block; position:absolute; top:12px; left:12px; z-index:4;
      padding:7px 12px; border:1px solid var(--line); border-radius:9px;
      background:var(--panel); cursor:pointer; font-size:12.5px;
      box-shadow:var(--sombra-flotante)}
    .contador{left:auto; right:12px; top:12px}
    .mandos{top:52px; right:12px}
    .ficha{left:12px; width:auto; top:auto; height:56%}
  }
</style>
</head>
<body>
<div class="app">

  <aside id="lateral">
    <div class="cabecera">
      <h1>Grafo de conceptos</h1>
      <div class="sello"><b id="s-nodos">—</b> conceptos escritos ·
        <b id="s-aristas">—</b> relaciones<br>Compilado el <span id="s-fecha"></span></div>
    </div>

    <div class="bloque">
      <div class="rot">Vista</div>
      <div class="segmentado" id="vista">
        <button data-v="conceptos" aria-pressed="true">Conceptos</button>
        <button data-v="modulos" aria-pressed="false">Módulos</button>
      </div>
    </div>

    <div class="bloque">
      <div class="rot"><span>Buscar</span></div>
      <input type="search" id="busqueda" placeholder="título, sinónimo, etiqueta…"
             autocomplete="off" spellcheck="false">
    </div>

    <div class="bloque">
      <div class="rot"><span>Dominios</span><button id="todos-dom">todos</button></div>
      <div class="lista" id="lista-dom"></div>
    </div>

    <div class="bloque">
      <div class="rot"><span>Tipo de relación</span><button id="todos-rel">todos</button></div>
      <div class="lista" id="lista-rel"></div>
    </div>

    <div class="bloque">
      <div class="rot">Opciones</div>
      <div class="opciones">
        <label class="item"><input type="checkbox" id="op-a"><span class="txt">Solo prioridad A (núcleo)</span></label>
        <label class="item"><input type="checkbox" id="op-ctr"><span class="txt">Solo conceptos con controversia</span></label>
        <label class="item"><input type="checkbox" id="op-huerf"><span class="txt">Ocultar conceptos sin relaciones</span></label>
        <label class="item"><input type="checkbox" id="op-foco"><span class="txt">Aislar el seleccionado y sus vecinos</span></label>
        <label class="item"><input type="checkbox" id="op-etq"><span class="txt">Mostrar todas las etiquetas</span></label>
        <label class="item"><input type="checkbox" id="op-cluster" checked><span class="txt">Agrupar por módulo</span></label>
      </div>
    </div>

    <div class="pie" id="pie">
      Dibuja lo escrito, no lo presupuestado: <b id="s-cobertura">—</b>.
      Reconstruir con <code>python3 build/grafo.py</code>.
    </div>
  </aside>

  <main id="lienzo">
    <button class="abre-menu" id="abre-menu">☰ Filtros</button>
    <canvas id="cv"></canvas>

    <div class="flotante contador">
      <b id="c-nodos">0</b> nodos · <b id="c-aristas">0</b> aristas
    </div>

    <div class="flotante mandos">
      <button id="m-mas" title="Acercar">＋</button>
      <button id="m-menos" title="Alejar">−</button>
      <button id="m-ajustar" title="Encajar todo">⤢</button>
      <button id="m-reordena" title="Reordenar">↻</button>
    </div>

    <div class="flotante aviso" id="aviso">
      Arrastra para mover, rueda para acercar, clic en un nodo para abrir su ficha.
    </div>

    <div class="flotante ficha" id="ficha" hidden>
      <header>
        <div style="flex:1;min-width:0">
          <span class="cod" id="f-cod"></span>
          <h2 id="f-titulo"></h2>
        </div>
        <button class="cerrar" id="f-cerrar" title="Cerrar">×</button>
      </header>
      <div class="cuerpo" id="f-cuerpo"></div>
    </div>
  </main>
</div>

mpieza por el modelo que todavía estructura el sentido común"}, {"tipo": "modula", "o": "CPT-00216", "d": "CPT-00176", "f": 3, "nota": "Muchos mitos actuales son modelos históricos que sobrevivieron a su refutación"}, {"tipo": "requiere", "o": "CPT-00218", "d": "CPT-00217", "f": 5, "nota": "Las teorías del XIX enriquecen el esquema cartesiano sin abandonarlo"}, {"tipo": "modula", "o": "CPT-00217", "d": "CPT-00181", "f": 5, "nota": "Es el origen histórico del dualismo cuerpo-mente que sigue estructurando la creencia del paciente"}, {"tipo": "requiere", "o": "CPT-00219", "d": "CPT-00218", "f": 5, "nota": "Es la consecuencia clínica de que las teorías del XIX no explicaran los casos complejos"}, {"tipo": "modula", "o": "CPT-00218", "d": "CPT-00021", "f": 4, "nota": "La teoría de la especificidad es el origen del término «receptor del dolor»"}, {"tipo": "requiere", "o": "CPT-00220", "d": "CPT-00219", "f": 5, "nota": "La compuerta solo es posible tras el agotamiento del modelo de transmisión pasiva"}, {"tipo": "modula", "o": "CPT-00219", "d": "CPT-00212", "f": 5, "nota": "Es el origen histórico de la familia terminológica del descrédito"}, {"tipo": "requiere", "o": "CPT-00221", "d": "CPT-00220", "f": 5, "nota": "Separar el acierto conceptual del error en los detalles exige haber expuesto la teoría"}, {"tipo": "requiere", "o": "CPT-00222", "d": "CPT-00220", "f": 5, "nota": "La neuromatriz es el desarrollo del papel activo del cerebro que abrió la compuerta"}, {"tipo": "modula", "o": "CPT-00220", "d": "CPT-00070", "f": 5, "nota": "Es el origen histórico del concepto de modulación descendente"}, {"tipo": "requiere", "o": "CPT-00228", "d": "CPT-00221", "f": 4, "nota": "El caso de la compuerta es el patrón: incorrecta en detalles, decisiva en concepto"}, {"tipo": "modula", "o": "CPT-00221", "d": "CPT-00199", "f": 3, "nota": "Ilustra que la revisabilidad de un modelo no anula su aportación"}, {"tipo": "requiere", "o": "CPT-00223", "d": "CPT-00222", "f": 5, "nota": "Su adopción como explicación estándar de consulta merece tratamiento propio"}, {"tipo": "requiere", "o": "CPT-00224", "d": "CPT-00222", "f": 5, "nota": "La matriz del dolor es la transformación de la neuromatriz en objeto de neuroimagen"}, {"tipo": "modula", "o": "CPT-00222", "d": "CPT-00026", "f": 4, "nota": "El miembro fantasma es el fenómeno que la teoría fue construida para explicar"}, {"tipo": "requiere", "o": "CPT-00227", "d": "CPT-00223", "f": 5, "nota": "El residuo más reciente procede de la difusión clínica de la neuromatriz"}, {"tipo": "modula", "o": "CPT-00223", "d": "CPT-00159", "f": 5, "nota": "Explica por qué la fórmula del output cerebral está tan extendida"}, {"tipo": "requiere", "o": "CPT-00225", "d": "CPT-00224", "f": 5, "nota": "El fracaso de la especificidad abre la crítica al neurocentrismo"}, {"tipo": "modula", "o": "CPT-00224", "d": "CPT-00028", "f": 5, "nota": "La afirmación de que medir nocicepción no es medir dolor reside allí"}, {"tipo": "requiere", "o": "CPT-00226", "d": "CPT-00225", "f": 5, "nota": "Es el nombre técnico y el argumento formal de la crítica al neurocentrismo"}, {"tipo": "modula", "o": "CPT-00225", "d": "CPT-00142", "f": 4, "nota": "Es el antecedente directo de la crítica enactiva al modelo biopsicosocial"}, {"tipo": "requiere", "o": "CPT-00227", "d": "CPT-00226", "f": 4, "nota": "El error de composición explica la forma del residuo más reciente"}, {"tipo": "modula", "o": "CPT-00226", "d": "CPT-00159", "f": 5, "nota": "Da el argumento formal a que «el dolor es un output del cerebro» sea impreciso"}, {"tipo": "requiere", "o": "CPT-00228", "d": "CPT-00227", "f": 5, "nota": "Identificados los residuos, queda cómo contarlo sin descalificar a quien los transmitió"}, {"tipo": "modula", "o": "CPT-00227", "d": "CPT-00211", "f": 5, "nota": "Explica el origen histórico de cada término de la lista negativa del corpus"}, {"tipo": "requiere", "o": "CPT-00229", "d": "CPT-00228", "f": 5, "nota": "Resuelto cómo contarla, quedan los límites de la propia historia"}, {"tipo": "modula", "o": "CPT-00228", "d": "CPT-00196", "f": 4, "nota": "Comparte la regla de no desautorizar a quien enseñó la creencia"}, {"tipo": "contrasta_con", "o": "CPT-00216", "d": "CPT-00229", "f": 4, "nota": "Cierra el módulo enfrentando lo que la historia promete con lo que puede dar"}, {"tipo": "modula", "o": "CPT-00229", "d": "CPT-00215", "f": 3, "nota": "Comparte con la terminología el mismo límite: entender no basta"}, {"tipo": "requiere", "o": "CPT-00230", "d": "CPT-00155", "f": 5, "nota": "El módulo desarrolla en el eje temporal lo que allí se afirmó: que el sistema se calibra con lo vivido"}, {"tipo": "requiere", "o": "CPT-00230", "d": "CPT-00009", "f": 4, "nota": "Aprender qué es el dolor a lo largo de la vida y calibrar el sistema son la cara psicológica y la biológica del mismo proceso"}, {"tipo": "modula", "o": "CPT-00230", "d": "CPT-00120", "f": 3, "nota": "Añade una variable predictora anterior a todas las demás: lo ocurrido antes de que hubiera biografía"}, {"tipo": "contrasta_con", "o": "CPT-00075", "d": "CPT-00230", "f": 3, "nota": "La calibración temprana es duradera; la sensibilización del adulto es reversible. Conviene no confundir escalas"}, {"tipo": "requiere", "o": "CPT-00231", "d": "CPT-00230", "f": 4, "nota": "La calibración explica por qué la omisión histórica de analgesia neonatal importa más allá del momento"}, {"tipo": "especializa", "o": "CPT-00231", "d": "CPT-00011", "f": 5, "nota": "Es el caso histórico más grave de la regla general: no poder comunicar el dolor no significa no experimentarlo"}, {"tipo": "contrasta_con", "o": "CPT-00219", "d": "CPT-00231", "f": 3, "nota": "Ambos documentan cómo un supuesto no examinado sostuvo durante décadas una práctica clínica"}, {"tipo": "modula", "o": "CPT-00231", "d": "CPT-00031", "f": 3, "nota": "La cautela sobre inferir dolor sin verbalización tiene un límite: aplicada al neonato produjo daño"}, {"tipo": "especializa", "o": "CPT-00232", "d": "CPT-00018", "f": 5, "nota":  unidad observable: la familia"}, {"tipo": "requiere", "o": "CPT-00235", "d": "CPT-00172", "f": 5, "nota": "El dolor como motivo de consulta y causa de incapacidad laboral es el contenido que esta etapa concentra"}, {"tipo": "modula", "o": "CPT-00235", "d": "CPT-00168", "f": 4, "nota": "La desigualdad en dolor se expresa en la edad adulta a través de qué trabajo se tiene y qué margen da"}, {"tipo": "modula", "o": "CPT-00235", "d": "CPT-00129", "f": 4, "nota": "El coste acumulado del dolor se paga sobre todo en los años de mayor carga de rol"}, {"tipo": "contrasta_con", "o": "CPT-00235", "d": "CPT-00237", "f": 3, "nota": "Dos etapas con el mismo dolor y presiones opuestas: seguir produciendo frente a que se dé por normal"}, {"tipo": "requiere", "o": "CPT-00236", "d": "CPT-00234", "f": 5, "nota": "La transición ocurre justo cuando el riesgo de instalación es máximo: por eso el corte importa"}, {"tipo": "modula", "o": "CPT-00236", "d": "CPT-00129", "f": 4, "nota": "El coste acumulado del dolor incluye el tiempo perdido en una discontinuidad administrativa"}, {"tipo": "contrasta_con", "o": "CPT-00108", "d": "CPT-00236", "f": 3, "nota": "Frente al cribado, que se afirma proceso continuo, aquí el sistema introduce una discontinuidad por edad"}, {"tipo": "requiere", "o": "CPT-00237", "d": "CPT-00170", "f": 5, "nota": "Retoma la afirmación de que la edad aumenta la prevalencia pero no explica el impacto y extrae su consecuencia clínica"}, {"tipo": "especializa", "o": "CPT-00237", "d": "CPT-00186", "f": 5, "nota": "Es la versión desarrollada del mito «es la edad», con la evidencia que lo desmonta"}, {"tipo": "contrasta_con", "o": "CPT-00183", "d": "CPT-00237", "f": 4, "nota": "El umbral sí cambia con la edad, y precisamente por eso no significa lo que se supone"}, {"tipo": "modula", "o": "CPT-00237", "d": "CPT-00088", "f": 3, "nota": "Que un hallazgo sea frecuente a cierta edad reduce lo que explica, y aquí se convierte además en excusa para no valorar"}, {"tipo": "requiere" /* ------------------------------------------------------------------ *
 * Paleta por dominio. 15 tonos separados en tono y luminosidad para
 * que el dominio se lea sin leyenda una vez memorizados los tres o
 * cuatro primeros, que son los que hoy tienen contenido.
 * ------------------------------------------------------------------ */
const COLOR_DOM = {
  D01:'#2f7f8f', D02:'#7b5ea7', D03:'#c9a227', D04:'#4a8c5a', D05:'#c25e4a',
  D06:'#3f6fb5', D07:'#a8547e', D08:'#5f8f3f', D09:'#b8763a', D10:'#4aa3a3',
  D11:'#8a6cc4', D12:'#9c9330', D13:'#3d8f7a', D14:'#b04f6a', D15:'#6b7f92'
};
const COLOR_REL = {
  requiere:'#2f7f8f', contiene:'#4a8c5a', especializa:'#4aa3a3', causa:'#b8763a',
  modula:'#c9a227', contrasta_con:'#7b5ea7', se_confunde_con:'#c25e4a',
  contradice:'#b04f6a', sinonimo_de:'#6b7f92', se_explica_con:'#a8547e',
  se_evalua_con:'#3f6fb5', se_interviene_con:'#5f8f3f', aplica_a:'#8a6cc4'
};

const nodoPorId = new Map(D.nodos.map(n => [n.id, n]));

// Adyacencia completa (sin filtros): la usa la ficha lateral y el modo foco.
const adyacencia = new Map();
for (const n of D.nodos) adyacencia.set(n.id, []);
for (const a of D.aristas) {
  adyacencia.get(a.o)?.push({...a, otro:a.d, dir:'sale'});
  adyacencia.get(a.d)?.push({...a, otro:a.o, dir:'entra'});
}

const estado = {
  vista:'conceptos',
  dominios:new Set(Object.keys(D.modulos).map(m => D.modulos[m].dom)),
  tipos:new Set(Object.keys(D.tipos)),
  busqueda:'', soloA:false, soloCtr:false, sinHuerfanos:false,
  foco:false, etiquetas:false, cluster:true,
  sel:null, hover:null
};

/* ------------------------------------------------------------------ *
 * Construcción del grafo visible
 * ------------------------------------------------------------------ */
let nodos = [], aristas = [];
const memoria = new Map();   // id -> {x,y} para no perder el layout al filtrar

function normaliza(s){
  return (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
}

function coincide(n){
  const q = normaliza(estado.busqueda);
  if (!q) return true;
  return normaliza(n.t).includes(q) || normaliza(n.id).includes(q) ||
         (n.tags||[]).some(t => normaliza(t).includes(q)) ||
         normaliza(n.def).includes(q) || normaliza(n.res).includes(q);
}

function pasaFiltros(n){
  if (!estado.dominios.has(n.dom)) return false;
  if (estado.soloA && n.p !== 'A') return false;
  if (estado.soloCtr && !n.ctr) return false;
  return true;
}

// Semilla en espiral de Fermat: reparte los nodos nuevos a distancia regular.
// Con posiciones aleatorias hay pares casi superpuestos y la repulsión los
// dispara, dejando el grafo a una escala de la que ya no se recupera.
function semilla(i, giro = 0){
  const sep = estado.vista === 'modulos' ? 75 : 17;
  const a = i * 2.39996 + giro, r = sep * Math.sqrt(i + .5);
  return {x: Math.cos(a) * r, y: Math.sin(a) * r};
}

function construir(){
  const previa = new Map(nodos.map(n => [n.id, n]));
  for (const n of nodos) memoria.set(n.id, {x:n.x, y:n.y});

  const base = D.nodos.filter(pasaFiltros);
  let visibles = new Set(base.map(n => n.id));

  // Modo foco: solo el seleccionado y sus vecinos directos.
  if (estado.foco && estado.sel && nodoPorId.has(estado.sel)) {
    const cerca = new Set([estado.sel]);
    for (const r of adyacencia.get(estado.sel) || []) {
      if (estado.tipos.has(r.tipo)) cerca.add(r.otro);
    }
    visibles = new Set([...visibles].filter(id => cerca.has(id)));
    visibles.add(estado.sel);
  }

  let ar = D.aristas.filter(a =>
    estado.tipos.has(a.tipo) && visibles.has(a.o) && visibles.has(a.d));

  if (estado.sinHuerfanos) {
    const conectados = new Set();
    for (const a of ar) { conectados.add(a.o); conectados.add(a.d); }
    visibles = new Set([...visibles].filter(id => conectados.has(id)));
    ar = ar.filter(a => visibles.has(a.o) && visibles.has(a.d));
  }

  if (estado.vista === 'conceptos') {
    nodos = [...visibles].map((id, i) => {
      const n = nodoPorId.get(id), vieja = previa.get(id) || memoria.get(id) || semilla(i);
      return {
        id, ref:n, etiqueta:n.t, color:COLOR_DOM[n.dom] || '#6b7f92',
        grupo:n.mod, peso:1, r:4 + Math.sqrt(n.g) * 1.9,
        x:vieja.x, y:vieja.y, vx:0, vy:0, fijo:false
      };
    });
    aristas = ar.map(a => ({...a, peso:1}));
  } else {
    // Vista agregada: un nodo por módulo, aristas ponderadas por nº de relaciones.
    const cuenta = new Map(), pesos = new Map();
    for (const id of visibles) {
      const m = nodoPorId.get(id).mod;
      cuenta.set(m, (cuenta.get(m) || 0) + 1);
    }
    for (const a of ar) {
      const mo = nodoPorId.get(a.o).mod, md = nodoPorId.get(a.d).mod;
      if (mo === md) continue;   // la cohesión interna se lee en el tamaño
      const k = mo < md ? mo+'|'+md+'|'+a.tipo : md+'|'+mo+'|'+a.tipo;
      pesos.set(k, (pesos.get(k) || 0) + 1);
    }
    nodos = [...cuenta].map(([mid, n], i) => {
      const m = D.modulos[mid], vieja = previa.get(mid) || memoria.get(mid) || semilla(i);
      return {
        id:mid, ref:null, modulo:m, cuenta:n,
        etiqueta:`${mid} · ${m.n}`, color:COLOR_DOM[m.dom] || '#6b7f92',
        grupo:m.dom, peso:n, r:6 + Math.sqrt(n) * 3.2,
        x:vieja.x, y:vieja.y, vx:0, vy:0, fijo:false
      };
    });
    aristas = [...pesos].map(([k, p]) => {
      const [o, d, tipo] = k.split('|');
      return {o, d, tipo, peso:p, f:3, nota:''};
    });
  }

  const idx = new Map(nodos.map((n,i) => [n.id, i]));
  aristas = aristas.filter(a => idx.has(a.o) && idx.has(a.d));
  for (const a of aristas) { a.io = idx.get(a.o); a.id_ = idx.get(a.d); }

  vecinos = new Map(nodos.map(n => [n.id, new Set()]));
  for (const a of aristas) { vecinos.get(a.o).add(a.d); vecinos.get(a.d).add(a.o); }

  document.getElementById('c-nodos').textContent = nodos.length;
  document.getElementById('c-aristas').textContent = aristas.length;
  alfa = 1;
}
let vecinos = new Map();

/* ------------------------------------------------------------------ *
 * Simulación de fuerzas. n≤281, así que la repulsión par a par cabe
 * de sobra en un frame; no hace falta Barnes-Hut.
 * ------------------------------------------------------------------ */
let alfa = 1;
// La gravedad solo tiene que impedir que las islas se vayan al infinito, no
// comprimir el grafo: si domina, todo colapsa en una bola. Las dos vistas
// piden calibrados distintos — 300 nodos pequeños y dispersos frente a 20
// nodos grandes y casi todos conectados entre sí.
const GRAVEDAD = .0022, ROCE = .82, CORTE2 = 1440000;
const CALIBRE = {
  conceptos: {rep: 4200,  largo: 38,  rigidez: .05,  cohesion: .006},
  modulos:   {rep: 24000, largo: 165, rigidez: .018, cohesion: .0015}
};

function paso(){
  if (alfa < .004) return false;
  const n = nodos.length;
  if (!n) return false;
  const C = CALIBRE[estado.vista];

  for (let i = 0; i < n; i++){
    const a = nodos[i];
    for (let j = i+1; j < n; j++){
      const b = nodos[j];
      let dx = b.x - a.x, dy = b.y - a.y;
      let d2 = dx*dx + dy*dy;
      if (d2 < 1e-4) { dx = (Math.random()-.5); dy = (Math.random()-.5); d2 = 1e-4; }
      if (d2 > CORTE2) continue;                 // más allá de 1.200 px se ignoran
      const d = Math.sqrt(d2);
      // El tope evita que dos nodos casi superpuestos se disparen al infinito
      // en el primer frame y dejen el grafo a escala inservible. Escala con el
      // radio para que los nodos grandes de la vista de módulos se separen.
      const fuerza = Math.min(12 + (a.r + b.r) * .8, C.rep * (a.r + b.r) / 14 / d2);
      const fx = dx / d * fuerza, fy = dy / d * fuerza;
      a.vx -= fx; a.vy -= fy; b.vx += fx; b.vy += fy;
    }
  }

  for (const e of aristas){
    const a = nodos[e.io], b = nodos[e.id_];
    const dx = b.x - a.x, dy = b.y - a.y;
    const d = Math.hypot(dx, dy) || .01;
    const objetivo = C.largo + (a.r + b.r);
    const k = C.rigidez * Math.min(1.6, .5 + (e.f || 3) / 6) * Math.min(2, Math.log2(1 + (e.peso||1)));
    const f = (d - objetivo) * k;
    const fx = dx / d * f, fy = dy / d * f;
    a.vx += fx; a.vy += fy; b.vx -= fx; b.vy -= fy;
  }

  // Cohesión por grupo: acerca los conceptos del mismo módulo (o los módulos
  // del mismo dominio) sin llegar a separarlos en islas.
  if (estado.cluster){
    const cx = new Map(), cy = new Map(), cn = new Map();
    for (const nd of nodos){
      cx.set(nd.grupo, (cx.get(nd.grupo)||0) + nd.x);
      cy.set(nd.grupo, (cy.get(nd.grupo)||0) + nd.y);
      cn.set(nd.grupo, (cn.get(nd.grupo)||0) + 1);
    }
    for (const nd of nodos){
      const k = cn.get(nd.grupo);
      if (k < 2) continue;
      nd.vx += (cx.get(nd.grupo)/k - nd.x) * C.cohesion;
      nd.vy += (cy.get(nd.grupo)/k - nd.y) * C.cohesion;
    }
  }

  for (const nd of nodos){
    nd.vx -= nd.x * GRAVEDAD; nd.vy -= nd.y * GRAVEDAD;
    if (nd.fijo){ nd.vx = 0; nd.vy = 0; continue; }
    nd.vx *= ROCE; nd.vy *= ROCE;
    const v = Math.hypot(nd.vx, nd.vy);
    if (v > 22){ nd.vx *= 22/v; nd.vy *= 22/v; }
    nd.x += nd.vx * alfa; nd.y += nd.vy * alfa;
  }
  alfa *= .995;
  return true;
}

/* ------------------------------------------------------------------ *
 * Lienzo, cámara y dibujo
 * ------------------------------------------------------------------ */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W = 0, H = 0, dpr = 1;
const cam = {x:0, y:0, k:1};

function medir(){
  const r = cv.parentElement.getBoundingClientRect();
  dpr = Math.min(2, window.devicePixelRatio || 1);
  W = r.width; H = r.height;
  cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
new ResizeObserver(medir).observe(document.getElementById('lienzo'));

const aPantalla = p => ({x: p.x*cam.k + cam.x + W/2, y: p.y*cam.k + cam.y + H/2});
const aMundo = (sx, sy) => ({x: (sx - W/2 - cam.x)/cam.k, y: (sy - H/2 - cam.y)/cam.k});

function encajar(margen = 60){
  if (!nodos.length) return;
  let x0=Infinity, y0=Infinity, x1=-Infinity, y1=-Infinity;
  for (const n of nodos){
    x0 = Math.min(x0, n.x-n.r); y0 = Math.min(y0, n.y-n.r);
    x1 = Math.max(x1, n.x+n.r); y1 = Math.max(y1, n.y+n.r);
  }
  const k = Math.min((W-margen*2)/Math.max(1,x1-x0), (H-margen*2)/Math.max(1,y1-y0));
  cam.k = Math.max(.12, Math.min(2.4, k));
  cam.x = -(x0+x1)/2 * cam.k;
  cam.y = -(y0+y1)/2 * cam.k;
}

function tono(hex, alpha){
  const v = parseInt(hex.slice(1), 16);
  return `rgba(${v>>16&255},${v>>8&255},${v&255},${alpha})`;
}

function relevantes(){
  // Conjunto resaltado: seleccionado + vecinos, o resultados de búsqueda.
  const ancla = estado.hover || estado.sel;
  if (ancla && vecinos.has(ancla)) return new Set([ancla, ...vecinos.get(ancla)]);
  if (estado.busqueda){
    const s = new Set();
    for (const n of nodos){
      const r = n.ref || {t:n.etiqueta, id:n.id, tags:[], def:'', res:''};
      if (coincide(r)) s.add(n.id);
    }
    return s;
  }
  return null;
}

function dibujar(){
  const css = getComputedStyle(document.documentElement);
  const colorFondo = css.getPropertyValue('--lienzo').trim();
  const colorTinta = css.getPropertyValue('--ink').trim();
  const colorTinta2 = css.getPropertyValue('--ink-2').trim();
  const oscuro = document.documentElement.dataset.theme === 'dark' ||
    (!document.documentElement.dataset.theme &&
      matchMedia('(prefers-color-scheme: dark)').matches);

  ctx.save();
  ctx.fillStyle = colorFondo; ctx.fillRect(0,0,W,H);

  const marcados = relevantes();
  const atenua = marcados ? (oscuro ? .1 : .13) : 1;

  // --- aristas ---
  for (const e of aristas){
    const a = nodos[e.io], b = nodos[e.id_];
    const p = aPantalla(a), q = aPantalla(b);
    const dentro = !marcados || (marcados.has(a.id) && marcados.has(b.id));
    const base = COLOR_REL[e.tipo] || '#8fa6b0';
    const op = dentro ? (marcados ? .75 : (oscuro ? .3 : .34)) : atenua;
    ctx.strokeStyle = tono(base, op);
    ctx.lineWidth = Math.max(.6, Math.min(5, (e.peso>1 ? Math.log2(e.peso)+.8 : (e.f||3)/4)) * Math.min(1.4, cam.k));
    ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(q.x,q.y); ctx.stroke();

    // Punta de flecha solo en aristas dirigidas y resaltadas: si no, ruido.
    if (dentro && marcados && !D.tipos[e.tipo]?.sim && cam.k > .45){
      const ang = Math.atan2(q.y-p.y, q.x-p.x), L = 8;
      const bx = q.x - Math.cos(ang)*(b.r*cam.k + 3), by = q.y - Math.sin(ang)*(b.r*cam.k + 3);
      ctx.fillStyle = tono(base, .85);
      ctx.beginPath();
      ctx.moveTo(bx, by);
      ctx.lineTo(bx - Math.cos(ang-.42)*L, by - Math.sin(ang-.42)*L);
      ctx.lineTo(bx - Math.cos(ang+.42)*L, by - Math.sin(ang+.42)*L);
      ctx.closePath(); ctx.fill();
    }
  }

  // --- nodos ---
  const etiquetados = [];
  for (const n of nodos){
    const p = aPantalla(n);
    const r = Math.max(2, n.r * cam.k);
    if (p.x < -60 || p.x > W+60 || p.y < -60 || p.y > H+60) continue;
    const dentro = !marcados || marcados.has(n.id);
    const esSel = n.id === estado.sel;

    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, 6.2832);
    ctx.fillStyle = tono(n.color, dentro ? (oscuro ? .92 : .88) : atenua + .05);
    ctx.fill();

    if (n.ref && n.ref.ctr && dentro){
      ctx.lineWidth = 1.6; ctx.strokeStyle = tono('#c25e4a', .95); ctx.stroke();
    }
    if (esSel){
      ctx.lineWidth = 2.4; ctx.strokeStyle = colorTinta;
      ctx.beginPath(); ctx.arc(p.x, p.y, r+3.5, 0, 6.2832); ctx.stroke();
    }

    const merece = esSel || n.id === estado.hover ||
      (dentro && (estado.etiquetas || cam.k > 1.35 ||
        (estado.vista === 'modulos' && cam.k > .55) ||
        (marcados && marcados.size <= 24) || n.r > 13));
    if (merece) etiquetados.push({n, p, r, dentro});
  }

  // --- etiquetas (después, para que no las tapen los nodos) ---
  ctx.font = '500 11.5px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  const ocupado = [];
  for (const {n, p, r, dentro} of etiquetados){
    let txt = n.etiqueta;
    if (txt.length > 46) txt = txt.slice(0,44) + '…';
    const w = ctx.measureText(txt).width;
    // Sujeta la etiqueta al lienzo: centrada en el nodo se salía por los bordes.
    const cx = Math.max(w/2 + 5, Math.min(W - w/2 - 5, p.x));
    const caja = {x:cx - w/2 - 3, y:p.y + r + 3, w:w + 6, h:15};
    const choca = ocupado.some(o => !(caja.x > o.x+o.w || caja.x+caja.w < o.x ||
                                      caja.y > o.y+o.h || caja.y+caja.h < o.y));
    if (choca && n.id !== estado.sel && n.id !== estado.hover) continue;
    ocupado.push(caja);
    ctx.fillStyle = tono(oscuro ? '#0b1216' : '#f2f6f7', .72);
    ctx.fillRect(caja.x, caja.y, caja.w, caja.h);
    ctx.fillStyle = dentro ? colorTinta : colorTinta2;
    ctx.fillText(txt, cx, p.y + r + 4);
  }
  ctx.restore();
}

// Mientras el usuario no toque la cámara, la vista se reencaja sola: si no,
// el grafo se sigue expandiendo por detrás y aparece diminuto en una esquina.
let camaraTocada = false, frames = 0;

function bucle(){
  paso();
  if (!camaraTocada && alfa > .02 && (frames++ % 12 === 0)) encajar();
  dibujar();
  requestAnimationFrame(bucle);
}

/* ------------------------------------------------------------------ *
 * Interacción con el lienzo
 * ------------------------------------------------------------------ */
let arrastrando = null, panX = 0, panY = 0, movido = false, pulsado = false;

function nodoEn(sx, sy){
  const m = aMundo(sx, sy);
  let mejor = null, mejorD = Infinity;
  for (const n of nodos){
    const d = Math.hypot(n.x-m.x, n.y-m.y);
    const alcance = Math.max(n.r, 7/cam.k);
    if (d < alcance && d < mejorD){ mejor = n; mejorD = d; }
  }
  return mejor;
}

cv.addEventListener('pointerdown', ev => {
  cv.setPointerCapture(ev.pointerId);
  pulsado = true; movido = false;
  const n = nodoEn(ev.offsetX, ev.offsetY);
  if (n){ arrastrando = n; n.fijo = true; }
  else { panX = ev.offsetX - cam.x; panY = ev.offsetY - cam.y; cv.classList.add('arrastrando'); }
});

cv.addEventListener('pointermove', ev => {
  if (pulsado) movido = true;
  if (arrastrando){
    const m = aMundo(ev.offsetX, ev.offsetY);
    arrastrando.x = m.x; arrastrando.y = m.y;
    alfa = Math.max(alfa, .35);
    return;
  }
  if (pulsado && !arrastrando){
    cam.x = ev.offsetX - panX; cam.y = ev.offsetY - panY;
    camaraTocada = true;
    return;
  }
  const n = nodoEn(ev.offsetX, ev.offsetY);
  const nuevo = n ? n.id : null;
  if (nuevo !== estado.hover){ estado.hover = nuevo; cv.classList.toggle('sobre-nodo', !!n); }
});

function soltar(ev){
  if (arrastrando){ arrastrando.fijo = false; arrastrando = null; }
  else if (!movido){ seleccionar(nodoEn(ev.offsetX, ev.offsetY)?.id || null); }
  pulsado = false; cv.classList.remove('arrastrando');
}
cv.addEventListener('pointerup', soltar);
cv.addEventListener('pointercancel', () => { pulsado = false; arrastrando = null; });

cv.addEventListener('wheel', ev => {
  ev.preventDefault();
  camaraTocada = true;
  const antes = aMundo(ev.offsetX, ev.offsetY);
  cam.k = Math.max(.1, Math.min(4.5, cam.k * Math.exp(-ev.deltaY * .0016)));
  const despues = aMundo(ev.offsetX, ev.offsetY);
  cam.x += (despues.x - antes.x) * cam.k;
  cam.y += (despues.y - antes.y) * cam.k;
}, {passive:false});

/* ------------------------------------------------------------------ *
 * Ficha lateral
 * ------------------------------------------------------------------ */
const ficha = document.getElementById('ficha');
const esc = s => (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function seleccionar(id){
  estado.sel = id;
  if (estado.foco) construir();
  pintarFicha();
}

function pintarFicha(){
  const id = estado.sel;
  if (!id){ ficha.hidden = true; return; }
  ficha.hidden = false;
  if (estado.vista === 'modulos' && D.modulos[id]) return pintarModulo(id);
  const n = nodoPorId.get(id);
  if (!n){ ficha.hidden = true; return; }

  const mod = D.modulos[n.mod] || {n:'', dom:n.dom};
  const dom = D.dominios.find(d => d.id === n.dom) || {n:''};
  document.getElementById('f-cod').textContent = `${n.id} · ${n.mod}`;
  document.getElementById('f-titulo').textContent = n.t;

  const rels = (adyacencia.get(id) || []).filter(r => estado.tipos.has(r.tipo));
  const porTipo = {};
  for (const r of rels) (porTipo[r.tipo] ||= []).push(r);

  let html = `<div class="chips">
    <span class="chip fuerte">${esc(dom.n)}</span>
    <span class="chip">${esc(mod.n)}</span>
    <span class="chip">Prioridad ${esc(n.p)}</span>
    <span class="chip">${esc(n.e)}</span>
    <span class="chip">${esc(n.mad)}</span>
    <span class="chip">certeza: ${esc(n.cz)}</span>
    ${n.ctr ? '<span class="chip alerta">controversia</span>' : ''}
  </div>`;

  if (n.def) html += `<h3>Definición</h3><p>${esc(n.def)}</p>`;
  if (n.res) html += `<h3>Resumen</h3><p>${esc(n.res)}</p>`;
  if (D.publico) html += `<p class="vacio">Mapa estructural: el texto de cada
    concepto vive en la base de conocimiento y no se publica hasta pasar
    revisión experta.</p>`;

  html += `<h3>Relaciones · ${rels.length}</h3>`;
  if (!rels.length) html += `<p class="vacio">Sin relaciones declaradas con los tipos visibles.</p>`;
  for (const tipo of Object.keys(D.tipos)){
    const lote = porTipo[tipo];
    if (!lote) continue;
    for (const r of lote){
      const otro = nodoPorId.get(r.otro);
      if (!otro) continue;
      const sim = D.tipos[tipo].sim;
      const verbo = sim ? D.tipos[tipo].n
        : (r.dir === 'sale' ? D.tipos[tipo].n : '← ' + D.tipos[tipo].n);
      html += `<button class="rel" data-ir="${otro.id}"
          style="border-left-color:${COLOR_REL[tipo]||'#8fa6b0'}">
        <span class="quien">${esc(verbo)}</span>${esc(otro.t)}
        ${r.nota ? `<span class="nota">${esc(r.nota)}</span>` : ''}
      </button>`;
    }
  }

  if (n.tags?.length){
    html += `<h3>Etiquetas</h3><div class="chips">` +
      n.tags.map(t => `<span class="chip">${esc(t)}</span>`).join('') + `</div>`;
  }
  html += `<h3>Ficha</h3><div class="chips">
    <span class="chip">${esc(n.ta)}</span>
    <span class="chip">${n.refs} referencia${n.refs===1?'':'s'}</span>
    ${(n.aud||[]).map(a => `<span class="chip">${esc(a)}</span>`).join('')}
  </div>`;

  const cuerpo = document.getElementById('f-cuerpo');
  cuerpo.innerHTML = html;
  cuerpo.scrollTop = 0;
  cuerpo.querySelectorAll('[data-ir]').forEach(b =>
    b.onclick = () => { seleccionar(b.dataset.ir); centrarEn(b.dataset.ir); });
}

function pintarModulo(mid){
  const m = D.modulos[mid];
  const dom = D.dominios.find(d => d.id === m.dom) || {n:''};
  const dentro = D.nodos.filter(n => n.mod === mid).sort((a,b) => b.g - a.g);
  document.getElementById('f-cod').textContent = `${mid} · ${dom.n}`;
  document.getElementById('f-titulo').textContent = m.n;

  let html = `<div class="chips">
    <span class="chip fuerte">${m.esc} escritos</span>
    <span class="chip">${m.obj} presupuestados</span>
  </div>`;
  if (m.foco) html += `<h3>Foco</h3><p>${esc(m.foco)}</p>`;
  html += `<h3>Conceptos · ${dentro.length}</h3>`;
  for (const n of dentro){
    html += `<button class="rel" data-ir="${n.id}"
        style="border-left-color:${COLOR_DOM[n.dom]||'#8fa6b0'}">
      <span class="quien">${n.id} · ${n.g} relaciones</span>${esc(n.t)}</button>`;
  }
  const cuerpo = document.getElementById('f-cuerpo');
  cuerpo.innerHTML = html;
  cuerpo.scrollTop = 0;
  cuerpo.querySelectorAll('[data-ir]').forEach(b => b.onclick = () => {
    ponVista('conceptos');
    seleccionar(b.dataset.ir);
    centrarEn(b.dataset.ir);
  });
}

function centrarEn(id){
  const n = nodos.find(x => x.id === id);
  if (!n) return;
  camaraTocada = true;
  cam.k = Math.max(cam.k, 1.1);
  cam.x = -n.x * cam.k; cam.y = -n.y * cam.k;
}

document.getElementById('f-cerrar').onclick = () => {
  estado.sel = null;
  if (estado.foco) construir();
  ficha.hidden = true;
};

/* ------------------------------------------------------------------ *
 * Barra lateral
 * ------------------------------------------------------------------ */
function pintarDominios(){
  const cont = document.getElementById('lista-dom');
  const conContenido = D.dominios.filter(d => d.esc > 0);
  const vacios = D.dominios.length - conContenido.length;
  cont.innerHTML = conContenido.map(d => `
    <label class="item">
      <input type="checkbox" data-dom="${d.id}" ${estado.dominios.has(d.id)?'checked':''}>
      <span class="punto" style="background:${COLOR_DOM[d.id]}"></span>
      <span class="txt" title="${esc(d.n)}">${esc(d.n)}</span>
      <span class="num">${d.esc}</span>
    </label>`).join('') +
    (vacios ? `<div class="item off" style="cursor:default">
        <span class="punto" style="background:var(--line)"></span>
        <span class="txt">${vacios} dominios aún sin conceptos</span></div>` : '');
  cont.querySelectorAll('[data-dom]').forEach(chk => chk.onchange = () => {
    chk.checked ? estado.dominios.add(chk.dataset.dom) : estado.dominios.delete(chk.dataset.dom);
    construir();
  });
}

function pintarRelaciones(){
  const cont = document.getElementById('lista-rel');
  cont.innerHTML = Object.entries(D.tipos).map(([id, t]) => `
    <label class="item" title="${esc(t.d)}">
      <input type="checkbox" data-rel="${id}" ${estado.tipos.has(id)?'checked':''}>
      <span class="raya" style="border-top:2px solid ${COLOR_REL[id]||'#8fa6b0'}"></span>
      <span class="txt">${esc(t.n)}</span>
      <span class="num">${t.c}</span>
    </label>`).join('');
  cont.querySelectorAll('[data-rel]').forEach(chk => chk.onchange = () => {
    chk.checked ? estado.tipos.add(chk.dataset.rel) : estado.tipos.delete(chk.dataset.rel);
    construir();
    if (estado.sel) pintarFicha();
  });
}

function ponVista(v){
  if (estado.vista === v) return;
  estado.vista = v;
  document.querySelectorAll('#vista button').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.v === v)));
  estado.sel = null; ficha.hidden = true;
  camaraTocada = false;
  construir();
  for (let i = 0; i < 300; i++) paso();
  alfa = .5;
  encajar();
}
document.querySelectorAll('#vista button').forEach(b => b.onclick = () => ponVista(b.dataset.v));

const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
document.getElementById('busqueda').oninput = debounce(ev => {
  estado.busqueda = ev.target.value.trim();
}, 140);

document.getElementById('todos-dom').onclick = () => {
  const todos = D.dominios.filter(d => d.esc > 0).map(d => d.id);
  estado.dominios = new Set(estado.dominios.size === todos.length ? [] : todos);
  pintarDominios(); construir();
};
document.getElementById('todos-rel').onclick = () => {
  const todos = Object.keys(D.tipos);
  estado.tipos = new Set(estado.tipos.size === todos.length ? [] : todos);
  pintarRelaciones(); construir();
};

const opcion = (elId, campo, extra) => {
  document.getElementById(elId).onchange = ev => {
    estado[campo] = ev.target.checked;
    if (extra) extra();
    construir();
  };
};
opcion('op-a', 'soloA'); opcion('op-ctr', 'soloCtr');
opcion('op-huerf', 'sinHuerfanos'); opcion('op-foco', 'foco');
opcion('op-cluster', 'cluster');
document.getElementById('op-etq').onchange = ev => { estado.etiquetas = ev.target.checked; };

document.getElementById('m-mas').onclick = () => { camaraTocada = true; cam.k = Math.min(4.5, cam.k*1.3); };
document.getElementById('m-menos').onclick = () => { camaraTocada = true; cam.k = Math.max(.1, cam.k/1.3); };
document.getElementById('m-ajustar').onclick = () => { camaraTocada = false; encajar(); };
document.getElementById('m-reordena').onclick = () => {
  const giro = Math.random() * 6.28;
  nodos.forEach((n, i) => { const s = semilla(i, giro); n.x = s.x; n.y = s.y; n.vx = n.vy = 0; });
  memoria.clear();
  alfa = 1; camaraTocada = false;
};
document.getElementById('abre-menu').onclick = () =>
  document.getElementById('lateral').classList.toggle('abierta');

addEventListener('keydown', ev => {
  if (ev.key === 'Escape'){ estado.sel = null; ficha.hidden = true; if (estado.foco) construir(); }
  if (ev.key === '/' && document.activeElement.tagName !== 'INPUT'){
    ev.preventDefault(); document.getElementById('busqueda').focus();
  }
});

/* ------------------------------------------------------------------ *
 * Arranque
 * ------------------------------------------------------------------ */
document.getElementById('s-nodos').textContent = D.nodos.length;
document.getElementById('s-aristas').textContent = D.aristas.length;
document.getElementById('s-fecha').textContent = D.generado;
document.getElementById('s-cobertura').textContent =
  `${D.nodos.length} de ${D.objetivo.toLocaleString('es-ES')} conceptos previstos`;
document.getElementById('aviso').innerHTML =
  `Cada nodo es un concepto escrito y cada arista una relación declarada en su ficha. ` +
  `El tamaño es el número de relaciones; el color, el dominio. ` +
  `<b>${D.nodos.length} de ${D.objetivo.toLocaleString('es-ES')}</b> conceptos previstos, ` +
  `${D.huerfanos} todavía sin conectar.` +
  (D.publico ? `<br>Mapa estructural de un corpus en construcción y sin revisión
    experta: no es material de referencia clínica.` : '');
setTimeout(() => { document.getElementById('aviso').style.display = 'none'; }, 14000);

if (D.publico){
  document.getElementById('pie').innerHTML =
    `Mapa estructural de <b>${D.nodos.length}</b> conceptos escritos de
     ${D.objetivo.toLocaleString('es-ES')} previstos. Corpus en construcción,
     sin revisión experta: no es material de referencia clínica.
     Se regenera solo con cada cambio en la base de conocimiento.`;
}

medir();
pintarDominios();
pintarRelaciones();
construir();
// Pre-relajación: el grafo aparece ya desplegado, no como una nube que estalla.
// Se devuelve alfa después porque si no el layout nace congelado a medio hacer.
for (let i = 0; i < 400; i++) paso();
alfa = .55;
encajar();
bucle();
</script>

</html>
